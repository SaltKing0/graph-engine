name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The default install path: core deps only, HashEmbedder, no PyTorch.
  # Tests that need the real embedder skip here (they run in test-st).
  test:
    name: test (${{ matrix.python-version }}, light install)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
      - name: Install optional PDF parser
        run: python -m pip install -e ".[pdf]"
      - name: Test document import including PDF
        run: python -m pytest tests/test_document_import.py --fail-on-skip -q
      - name: Offline memory retrieval and evidence smoke
        run: >-
          python -m tools.memory_benchmark --smoke --check
          --output "${{ runner.temp }}/memory-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: memory-smoke-${{ matrix.python-version }}
          path: ${{ runner.temp }}/memory-smoke.json

  # The [st] extra path: real sentence-transformers embedder. Keeps the
  # embedder-dependent tests (model override, demo near-dup measurement)
  # honest instead of silently skipped. CPU torch wheel to stay light.
  test-st:
    name: test (3.12, real embedder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,st]"
      - name: Test local model trust, embeddings and cross-encoder without downloads
        run: python -m pytest tests/test_model_trust.py --fail-on-skip -q
      - name: Test
        run: python -m pytest tests/ -q

  test-mcp:
    name: test (${{ matrix.python-version }}, MCP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install MCP extra
        run: python -m pip install -e ".[dev,mcp]"
      - name: Test MCP transport, tools and access boundaries
        run: >-
          python -m pytest tests/test_mcp.py tests/test_access_namespaces.py
          tests/test_entities.py tests/test_fact_validity.py tests/test_graph_retrieval.py
          --fail-on-skip -q

  test-browser:
    name: test (3.12, Chromium)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/graph-engine-playwright
      GRAPH_ENGINE_TEST_D3: /tmp/graph-engine-d3.v7.min.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser dependencies
        run: |
          python -m pip install -e ".[dev]" "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Fetch integrity-checked graph library
        run: curl --fail --location --retry 3 https://d3js.org/d3.v7.min.js --output "$GRAPH_ENGINE_TEST_D3"
      - name: Test browser workflows and XSS protection
        run: python -m pytest tests/test_frontend_xss.py --fail-on-skip -q
