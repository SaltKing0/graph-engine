<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>GraphEngine Review</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
            --green:#3fb950; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-monospace,Menlo,monospace;
           height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    header { display:flex; align-items:center; gap:12px; padding:10px 14px;
             border-bottom:1px solid var(--border); flex:none; }
    header h1 { font-size:13px; margin:0; color:var(--dim); font-weight:normal; }
    header .count { color:var(--blue); }
    header a { color:var(--dim); font-size:12px; text-decoration:none; }\n    header a:first-of-type { margin-left:auto; }
    header a:hover { color:var(--fg); }

    #flash { position:fixed; top:52px; left:50%; transform:translateX(-50%);
             background:var(--panel); border:1px solid var(--green); border-radius:6px;
             padding:8px 18px; font-size:13px; opacity:0; transition:opacity .3s; z-index:10;
             pointer-events:none; }

    #main { flex:1; display:flex; min-height:0; }

    /* Left column: search + node picker for same_as */
    #side { width:400px; flex:none; border-right:1px solid var(--border);
            display:flex; flex-direction:column; min-height:0; }
    #side .pane { padding:12px; border-bottom:1px solid var(--border); }
    #side h2 { margin:0 0 8px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
    #search { width:100%; background:var(--panel); border:1px solid var(--border); color:var(--fg);
              padding:8px 12px; font-family:inherit; font-size:13px; border-radius:6px; outline:none; }
    #search:focus { border-color:var(--blue); }
    #hits { max-height:200px; overflow-y:auto; margin-top:6px; }
    .hit { padding:6px 10px; font-size:12px; cursor:pointer; border-radius:6px; color:var(--dim); }
    .hit:hover { background:var(--panel); color:var(--fg); }
    .hit .id { color:var(--dim); font-size:10px; margin-right:6px; }
    .hit.pickedA { background:#1c2128; color:var(--purple); }
    .hit.pickedB { background:#1c2128; color:var(--green); }

    #pickbar { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--dim); margin-top:8px; }
    #pickbar .slot { flex:1; background:var(--panel); border:1px dashed var(--border); border-radius:6px;
                     padding:6px 8px; min-height:34px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    #pickbar .slot.filled { border-style:solid; }
    #pickbar .slot.a.filled { color:var(--purple); border-color:var(--purple); }
    #pickbar .slot.b.filled { color:var(--green); border-color:var(--green); }
    #linkbtn { background:#6e40c9; border:none; color:#fff; padding:8px 12px; font-family:inherit;
               font-size:11px; border-radius:6px; cursor:pointer; }
    #linkbtn:disabled { opacity:.4; cursor:default; }
    .hint { font-size:10px; color:var(--dim); margin-top:6px; }

    /* Right column: inbox */
    #inbox { flex:1; overflow-y:auto; padding:12px 16px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
            padding:14px; margin-bottom:10px; font-size:13px; }
    .card.active { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
    .kind { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px;
            border:1px solid var(--border); color:var(--dim); margin-bottom:8px; }
    .kind[data-kind="similar"] { color:var(--green); border-color:var(--green); }
    .kind[data-kind="extends"] { color:var(--blue); border-color:var(--blue); }
    .side-label { font-size:10px; color:var(--dim); margin:8px 0 2px; }
    .nodebox { background:var(--bg); border-radius:6px; padding:8px 10px; font-size:12px;
               max-height:88px; overflow-y:auto; }
    .nodebox .id { color:var(--dim); font-size:10px; }
    .nodebox.pickable { cursor:pointer; }
    .nodebox.pickable:hover { outline:1px solid var(--purple); }
    .actions { display:flex; gap:8px; margin-top:10px; }
    .actions button { flex:1; border:none; padding:8px; font-family:inherit; font-size:12px;
                      border-radius:6px; cursor:pointer; }
    .ok { background:#238636; color:#fff; }
    .no { background:#21262d; color:var(--fg); border:1px solid var(--border) !important; }
    .swap { background:none; color:var(--dim); border:1px solid var(--border); padding:4px 8px;
            font-size:10px; border-radius:6px; cursor:pointer; margin-left:8px; }
  </style>
</head>
<body>
<header>
  <h1>GraphEngine Review · <span class="count" id="count">0 pending</span></h1>
  <a href="/">\n    <a href="/report">report</a>← Cockpit</a>
</header>
<div id="flash"></div>

<div id="main">
  <div id="side">
    <div class="pane">
      <h2>Link same_as</h2>
      <input id="search" placeholder="Search nodes … (s)">
      <div id="hits"></div>
      <div id="pickbar">
        <div class="slot a" id="slotA">A: empty</div>
        <div class="slot b" id="slotB">B: empty</div>
        <button id="linkbtn" disabled>Link ⏎</button>
      </div>
      <div class="hint">Click a hit: 1st click → A, 2nd → B. x clears the selection.</div>
    </div>
  </div>
  <div id="inbox"><h2 style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;">Pending Edges</h2><div id="cards"></div></div>
</div>

<script src="/review.js"></script>
</body>
</html>
